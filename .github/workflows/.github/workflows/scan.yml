
name: Short Squeeze Radar Scanner

on:
  workflow_dispatch:
  schedule:
    # Weekdays at 9:30 PM UTC
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: squeeze-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run squeeze scanner
        run: |
          if [ -f scanner.py ]; then
            python scanner.py
          elif [ -f scan.py ]; then
            python scan.py
          else
            echo "ERROR: Scanner script not found."
            echo "Check the Python script filename."
            exit 1
          fi

      - name: Save scan results and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -u
          git add -f \
            data/*.json data/*.csv \
            *.json *.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Update squeeze radar scan data"
            git push
          else
            echo "No data changes to commit"
          fi
